openapi: 3.1.2
info:
  title: appdash-backend
  description: This is the appdash backend based on the reference architecture of it@M
  version: 0.0.1-SNAPSHOT

servers:
  - url: /

tags:
  - name: Apps
    description: Related to apps

security:
  - bearerAuth: []

paths:
  /api/v1/apps:
    get:
      tags:
        - Apps
      operationId: getAllApps
      parameters:
        - name: page
          in: query
          required: false
          description: Page index (default is 0)
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          required: false
          description: Size of the page to be returned (default is 20)
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppResponseDTO"
    post:
      tags:
        - Apps
      operationId: createApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRequestDTO"
      responses:
        "201":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppResponseDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/apps/{id}:
    get:
      tags:
        - Apps
      operationId: getAppById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppResponseDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    put:
      tags:
        - Apps
      operationId: updateApp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppRequestDTO"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppResponseDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      tags:
        - Apps
      operationId: deleteApp
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Successful operation
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/apps/{id}/history:
    get:
      tags:
        - Apps
      operationId: getAppHistory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppRevisionDTO"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      name: bearerAuth
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid input provided
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - message
        - timestamp
      properties:
        error:
          type: string
          description: Machine-readable error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          additionalProperties: true
          description: Additional error context
        timestamp:
          type: string
          format: date-time
        traceId:
          type: string
          description: Unique identifier for error tracing

    InfoMappingDTO:
      type: object
      required:
        - key
        - value
      properties:
        key:
          type: string
        value:
          type: string

    AppRequestDTO:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        creator:
          type: string
        img:
          type: string
        description:
          type: string
        bundleId:
          type: string
        appstoreId:
          type: string
        eKey:
          type: string
        epicKey:
          type: string
        privacyPolicy:
          type: string
        website:
          type: string
        isInternal:
          type: boolean
        priorityId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        mbucId:
          type: integer
          format: int64
        visibilityId:
          type: integer
          format: int64
        customerInfos:
          type: array
          items:
            $ref: "#/components/schemas/InfoMappingDTO"
        urlInfos:
          type: array
          items:
            $ref: "#/components/schemas/InfoMappingDTO"
        imgInfos:
          type: array
          items:
            $ref: "#/components/schemas/InfoMappingDTO"
        privacyInfos:
          type: array
          items:
            $ref: "#/components/schemas/InfoMappingDTO"

    AppResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        timestampCreated:
          type: string
          format: date-time
        timestampUpdated:
          type: string
          format: date-time
        name:
          type: string
        creator:
          type: string
        img:
          type: string
        description:
          type: string
        bundleId:
          type: string
        appstoreId:
          type: string
        eKey:
          type: string
        epicKey:
          type: string
        privacyPolicy:
          type: string
        website:
          type: string
        isInternal:
          type: boolean
        priorityId:
          type: integer
          format: int64
        categoryId:
          type: integer
          format: int64
        mbucId:
          type: integer
          format: int64
        visibilityId:
          type: integer
          format: int64
        customerInfos:
          type: array
          items:
            $ref: "#/components/schemas/InfoMappingDTO"
        urlInfos:
          type: array
          items:
            $ref: "#/components/schemas/InfoMappingDTO"
        imgInfos:
          type: array
          items:
            $ref: "#/components/schemas/InfoMappingDTO"
        privacyInfos:
          type: array
          items:
            $ref: "#/components/schemas/InfoMappingDTO"
        appProcesses:
          type: array
          items:
            $ref: "#/components/schemas/AppProcessResponseDTO"

    AppProcessResponseDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        timestampCreated:
          type: string
          format: date-time
        timestampUpdated:
          type: string
          format: date-time
        description:
          type: string
        mdm:
          type: string
        isPilot:
          type: boolean
        isCritical:
          type: boolean
        osId:
          type: integer
          format: int64
        trendId:
          type: integer
          format: int64
        numberOfUsersId:
          type: integer
          format: int64
        statusId:
          type: integer
          format: int64
        laneId:
          type: integer
          format: int64
        vivId:
          type: integer
          format: int64

    AppRevisionDTO:
      type: object
      properties:
        revisionId:
          type: integer
        revisionTimestamp:
          type: string
          format: date-time
        revisionType:
          type: string
          enum: [INSERT, UPDATE, DELETE]
        username:
          type: string
        entity:
          $ref: "#/components/schemas/AppResponseDTO"
